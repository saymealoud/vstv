name: Publish mobile release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing mobile release tag
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  attach-apk:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v') && contains(github.event.release.tag_name || inputs.tag, '-mobile.')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Find successful APK build for the exact release commit
        id: build
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse HEAD)
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mobile-player.yml/runs?head_sha=$COMMIT_SHA&status=success&per_page=10" --jq '.workflow_runs[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful mobile APK build exists for release commit $COMMIT_SHA."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using successful build $RUN_ID for $COMMIT_SHA"
      - name: Download verified build artifact within GitHub
        shell: bash
        env:
          BUILD_RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name vstv-mobile-test-arm --dir mobile-apk
          mapfile -d '' APK_FILES < <(find mobile-apk -type f -name '*.apk' -print0)
          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ARM APK."
            exit 1
          fi
          mkdir -p release-assets
          cp "${APK_FILES[0]}" release-assets/vstv-mobile-test-arm.apk
          (cd release-assets && sha256sum vstv-mobile-test-arm.apk > SHA256SUMS.txt)
      - name: Attach APK and checksum to this repository release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/vstv-mobile-test-arm.apk release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
