name: Mobile player test APK
on:
  push:
    branches: [feat/mobile-player]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Test and build portable ARM APK
        run: bash ./gradlew :app:testOriginalArmDebugUnitTest :app:assembleOriginalArmDebug -PsystemDecodersOnly=true --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vstv-mobile-test-arm
          path: app/build/outputs/apk/originalArm/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/
